# Two independent perspectives; the Lead relays conflicts after both first handbacks.
# Routing enforces mail isolation. Prompts govern independence and read-only analysis;
# neither this template nor its prompts provide a filesystem sandbox.
template: dual-lane-adjudication
summary: A Lead frames a difficult problem, asks two independent model families, exchanges their conflicts, and resolves the decision by evidence.
auto_join_role: lead
roles:
  lead:
    description: Chooses two useful perspectives, collects independent analysis, relays conflicts and owns the resolution.
    instructions_file: prompts/dual-lane-adjudication/lead.md
    tools: [send, inbox, who, agent]
    can_spawn: [lane_a, lane_b]
    can_pin: false
    can_set_cwd: true
    spawn:
      harness: inherit
      model: inherit
      thinking: inherit
      allow_tools: []
  lane_a:
    description: Investigates the assigned perspective independently, then tests the other lane's conflicting claims.
    instructions_file: prompts/dual-lane-adjudication/lane.md
    tools: [send, inbox, who]
    can_spawn: []
    can_pin: false
    can_set_cwd: false
    spawn:
      harness: codex
      model: gpt-6-astra
      thinking: high
      allow_tools: []
  lane_b:
    description: Investigates the assigned perspective independently, then tests the other lane's conflicting claims.
    instructions_file: prompts/dual-lane-adjudication/lane.md
    tools: [send, inbox, who]
    can_spawn: []
    can_pin: false
    can_set_cwd: false
    spawn:
      harness: claude
      model: claude-opus-5-5
      thinking: high
      allow_tools: []
routing:
  - {from: lead, to: lane_a, allow: true, cc: []}
  - {from: lane_a, to: lead, allow: true, cc: []}
  - {from: lead, to: lane_b, allow: true, cc: []}
  - {from: lane_b, to: lead, allow: true, cc: []}
timers:
  - {on: lane_a, notify: reports_to, silent_for: 20m}
  - {on: lane_b, notify: reports_to, silent_for: 20m}
limits:
  depth: 2
  concurrency: 2
  messages_per_participant_per_minute: 30
  max_respawn_per_hour: none
