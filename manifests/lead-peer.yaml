# lead + peers. The Human talks to the Lead (the session that founds the team); the Lead owns the
# plan and integration and spawns Peers that own separate scopes. A Peer works with the Lead, not
# under it: it solves its piece its own way and raises a better way or a problem with the plan as
# early as it helps; the plan changes at the Lead, who puts the pieces together. Every role talks
# with `send`; routing is the fence: a Peer reaches only the Lead. Handbacks, questions and rework
# are mail with a kind. No extra state.
template: lead-peer
summary: A Lead holds the plan for a goal (code, research, writing, operations…) and puts the pieces together; Peers each solve one piece and think about the goal with the Lead.
auto_join_role: lead   # the founder's role when a session founds a team from this template
roles:
  lead:
    description: Splits the goal into scopes with one owner each, briefs Peers, weighs their evidence, judges each handback, and integrates.
    instructions_file: prompts/lead-peer/lead.md   # inlined by `piggery --admin team up`
    tools: [send, inbox, who, agent]
    can_spawn: [peer]
    can_set_cwd: true
    spawn:                 # how piggery starts this role's workers
      allow_tools: []      # native tools the harness profile turns off that this role keeps
  peer:
    description: Solves one piece of the goal its own way, raises a better way or a problem with the plan, and hands back what is true.
    instructions_file: prompts/lead-peer/peer.md
    tools: [send, inbox, who]
    can_spawn: []
    can_set_cwd: false
    spawn:                 # how piggery starts this role's workers
      allow_tools: []      # native tools the harness profile turns off that this role keeps
routing:
  - {from: lead, to: peer, allow: true, cc: []}
  - {from: peer, to: lead, allow: true, cc: []}
timers:
  - {on: peer, notify: reports_to, working_for: 20m}
limits:                  # none: no limit
  depth: 2                 # how deep spawned_by chains may go
  concurrency: 10           # live workers at once
  messages_per_participant_per_minute: 30
  max_respawn_per_hour: none
